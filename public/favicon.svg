<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="kb-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f14" />
      <stop offset="100%" stop-color="#152028" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="kb-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20b2a6" />
      <stop offset="50%" stop-color="#38d9cd" />
      <stop offset="100%" stop-color="#105b55" />
    </linearGradient>

    <!-- Teal Letter Gradient -->
    <linearGradient id="kb-teal" x1="0" y1="16" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ae3d6" />
      <stop offset="100%" stop-color="#20b2a6" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="kb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#20b2a6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#kb-bg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#kb-border)" stroke-width="2.5" />

  <!-- Subtle Corner Glow Node -->
  <circle cx="50" cy="14" r="2" fill="#38d9cd" opacity="0.8" />

  <!-- Monogram KB -->
  <g filter="url(#kb-glow)">
    <text
      x="32"
      y="43"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-weight="900"
      font-size="28"
      letter-spacing="-0.5"
    >
      <tspan fill="#ffffff">K</tspan>
      <tspan fill="url(#kb-teal)">B</tspan>
    </text>
  </g>
</svg>
